name: CI

# WOOFER runs entirely on-device (Flutter + Chaquopy/yt-dlp + ffmpeg_kit), so CI
# covers the three things that can break it: the Dart app, the Python bridge, and
# the Android build (Gradle + Chaquopy + ffmpeg_kit) with its native tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR supersedes a run still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with the tested toolchain table in app/android/CHAQUOPY.md.
  FLUTTER_VERSION: 3.47.1
  # Chaquopy's build toolchain requires exactly Python 3.12.
  PYTHON_VERSION: "3.12"
  JAVA_VERSION: "17"

jobs:
  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # --enforce-lockfile: fail instead of silently re-resolving, so CI always
      # tests exactly what pubspec.lock says.
      - run: flutter pub get --enforce-lockfile

      - run: flutter analyze

      # Coverage is a signal, not a target: collected and uploaded, never gated.
      - run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: app/coverage/lcov.info
          if-no-files-found: ignore

  python:
    name: Python bridge (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/android/app/requirements.txt

      # The same requirements.txt Chaquopy bundles into the APK, so the tests run
      # against exactly the yt-dlp that ships.
      - run: pip install -r app/android/app/requirements.txt pytest==8.4.2

      - run: python -m pytest src/test/python -q
        working-directory: app/android/app

  android:
    name: Android (profile build + native tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # Chaquopy picks this up from PATH; CI has no local.properties override.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # compileSdk is 37; the runner image may not ship that platform yet.
      # (The NDK is fetched by AGP on demand.)
      - name: Install the compileSdk platform
        working-directory: .
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      - run: flutter pub get --enforce-lockfile

      # Exercises Gradle, Chaquopy (pip install of the pinned yt-dlp) and
      # ffmpeg_kit. No key.properties here, so release-type builds fall back to
      # the debug key — fine for a CI artifact.
      - run: flutter build apk --profile

      # Kotlin tests incl. the Robolectric intent/receiver tests. The wrapper is
      # generated by the build above (gradlew is gitignored).
      - name: Native unit tests
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest

      # Job logs need a signed-in account; annotations don't. Surface each
      # failing test's message so a red run can be diagnosed from the PR.
      - name: Annotate native test failures
        if: failure()
        working-directory: app/build/app/test-results/testDebugUnitTest
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for p in glob.glob("*.xml"):
              for case in ET.parse(p).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      text = (bad.get("message") or bad.text or "")[:600]
                      text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY
